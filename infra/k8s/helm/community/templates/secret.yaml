{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "community.secretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "community.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.existingSecret is empty" .Values.secrets.jwtSecret | quote }}
  INTERNAL_API_TOKEN: {{ required "secrets.internalApiToken is required when secrets.existingSecret is empty" .Values.secrets.internalApiToken | quote }}
  OPENAI_API_KEY: {{ .Values.ai.apiKey | quote }}
  MEILI_KEY: {{ .Values.search.meiliKey | quote }}
{{- end }}
