apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "community.name" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "community.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  NODE_ENV: {{ .Values.env.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  WEB_ORIGIN: {{ .Values.env.webOrigin | quote }}
  JWT_REFRESH_TTL_DAYS: {{ .Values.env.jwtRefreshTtlDays | quote }}
  DATABASE_URL: {{ include "community.databaseUrl" . | quote }}
  ADMIN_DATABASE_URL: {{ include "community.adminDatabaseUrl" . | quote }}
  REDIS_URL: {{ include "community.redisUrl" . | quote }}
  API_INTERNAL_URL: {{ printf "http://%s-api:%v" (include "community.name" .) .Values.api.port | quote }}
  MEILI_HOST: {{ .Values.search.meiliHost | quote }}
  OPENAI_BASE_URL: {{ .Values.ai.baseUrl | quote }}
  OPENAI_MODEL: {{ .Values.ai.model | quote }}
  NEXT_PUBLIC_AI_ENABLED: {{ .Values.ai.enabled | quote }}
