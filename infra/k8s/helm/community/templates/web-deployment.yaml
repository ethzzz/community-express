apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "community.name" . }}-web
  labels:
    app.kubernetes.io/name: {{ include "community.name" . }}-web
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "community.name" . }}-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "community.name" . }}-web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "community.image" (dict "Values" .Values "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: PORT
              value: {{ .Values.web.port | quote }}
            - name: API_BASE_INTERNAL
              value: {{ printf "http://%s-api:%v" (include "community.name" .) .Values.api.port | quote }}
            - name: ADMIN_API_URL
              value: {{ printf "http://%s-admin:%v" (include "community.name" .) .Values.adminApi.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "community.name" . }}-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
