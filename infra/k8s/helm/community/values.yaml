global:
  imageRegistry: ""
  imagePullSecrets: []

api:
  replicaCount: 2
  image:
    repository: community-api
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

adminApi:
  replicaCount: 1
  image:
    repository: community-admin-api
    tag: latest
    pullPolicy: IfNotPresent
  port: 3002
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

web:
  replicaCount: 2
  image:
    repository: community-web
    tag: latest
    pullPolicy: IfNotPresent
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75

# 依赖按“外部托管”处理：生产环境使用云数据库 / 云 Redis，
# 集群内自建时把 host 指向对应 Service 即可。
mysql:
  host: mysql
  port: 3306
  database: community
  adminDatabase: community_admin
  username: root
  password: root

redis:
  host: redis
  port: 6379

search:
  meiliHost: ""
  meiliKey: ""

ai:
  enabled: false
  apiKey: ""
  baseUrl: https://api.openai.com/v1
  model: gpt-4o-mini

env:
  nodeEnv: production
  logLevel: info
  jwtRefreshTtlDays: "7"
  webOrigin: https://community.example.com

# 由外部 Secret 管理器注入时保持为空，直接引用已有 Secret。
secrets:
  existingSecret: ""
  jwtSecret: ""
  internalApiToken: ""

ingress:
  enabled: true
  className: nginx
  host: community.example.com
  tls:
    enabled: false
    secretName: community-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"

migrate:
  enabled: true
  backoffLimit: 3
